app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}


spring:
  application:
    name: user-management-api

  datasource:
    url: jdbc:postgresql://localhost:5432/customer
    username: notpoggoez
    password: password

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: [openid, email, profile]
          github:
            client-id: ${GITHUB_CLIENT_ID:}
            client-secret: ${GITHUB_CLIENT_SECRET:}
            scope: [read:user, user:email]
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  main:
    web-application-type: servlet

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  codec:
    max-in-memory-size: 10MB


server:
  port: 8080

cors:
  allowed-methods: GET,POST,PUT,DELETE
  allowed-origins: http://localhost:3000
  allowed-headers: "*"
  exposed-headers: "*"


jwt:
  secret-key: ${JWT_SECRET_KEY:foobar_123456789_foobar_123456789_foobar_123456789_foobar_123456789}


aws:
  region: us-east-1
  s3:
    buckets:
      customer: notpoggoez-customer

sqs:
  file-upload-queue-url: ${FILE_UPLOAD_QUEUE_URL"}
    
