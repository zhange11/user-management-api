spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customer
    username: notpoggoez
    password: password
    jpa:
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect
          format_sql: true
      show-sql: true
    main:
      web-application-type: servlet
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB
    codec:
      max-in-memory-size: 10MB
  application:
    name: user-management-api

server:
  port: 8080

cors:
  allowed-methods: GET, POST, PUT, DELETE
  allowed-origins: http://localhost:3000
  allowed-headers: "*"
  exposed-headers: "*"


jwt:
  secret-key: ${JWT_SECRET_KEY:foobar_123456789_foobar_123456789_foobar_123456789_foobar_123456789}


aws:
  region: us-east-1
  s3:
    buckets:
      customer: notpoggoez-customer

